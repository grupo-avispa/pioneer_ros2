# Simple set of rules for GitHub actions integration with a ROS project
#

name: Rolling Build

on:
  push:
    branches: [rolling]
  pull_request:
  workflow_dispatch:

env:
  ARIACODA_PATH: ${{ github.workspace }}/ariacoda
  ARIACODA_URL: https://github.com/grupo-avispa/AriaCoda.git

jobs:
  install-ariacoda:
    runs-on: ubuntu-24.04
    steps:
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: git doxygen
      - name: Cache ARIACODA
        id: cache-ariacoda
        uses: actions/cache@v6.1.0
        with:
          path: |
            /usr/local/lib/libAria*
            /usr/local/include/Aria
          key: ariacoda-${{ runner.os }}-ubuntu-24.04
      - name: Install ARIACODA
        if: steps.cache-ariacoda.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.ARIACODA_PATH }} && cd ${{ env.ARIACODA_PATH }}
          git clone ${{ env.ARIACODA_URL }}
          cd ${{ env.ARIACODA_PATH }}/AriaCoda
          make && sudo make install

  install-pioneer:
    runs-on: ubuntu-24.04
    container:
      image: ros:rolling
    needs: install-ariacoda
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      # - name: Workaround restore system directories
      #   run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar
      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip python3-colcon-coveragepy-result
      - name: Restore AriaCoda cache
        id: restore-cache-ariacoda
        uses: actions/cache/restore@v4.2.0
        with:
          path: |
            /usr/local/lib/libAria*
            /usr/local/include/Aria
          key: ariacoda-${{ runner.os }}-ubuntu-24.04
      - name: Install ARIACODA
        if: steps.restore-cache-ariacoda.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen
          mkdir -p ${{ env.ARIACODA_PATH }} && cd ${{ env.ARIACODA_PATH }}
          git clone ${{ env.ARIACODA_URL }}
          cd ${{ env.ARIACODA_PATH }}/AriaCoda
          make && sudo make install
      - name: Build packages
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: |
            pioneer_ros2
            pioneer_aria
            pioneer_common
            pioneer_core
            pioneer_description
            pioneer_gazebo
            pioneer_modules
            pioneer_msgs
          target-ros2-distro: rolling
          vcs-repo-file-url: ./.github/repos-rolling.repos
          colcon-defaults: |
            {
              "build": {
                "mixin": ["coverage-gcc", "coverage-pytest"]
              },
              "test": {
                "mixin": ["coverage-pytest"]
              }
            }
          skip-tests: false
